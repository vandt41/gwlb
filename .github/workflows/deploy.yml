name: Deploy GWLB Vanilla Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/vanilla

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4